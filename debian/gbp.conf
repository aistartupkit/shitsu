# Configuration for git-buildpackage
# Follows DEP-14 naming conventions

[DEFAULT]
# Use pristine-tar
pristine-tar = True

# DEP-14 branch naming
debian-branch = debian/master
upstream-branch = upstream
upstream-tag = upstream/%(version)s

# DEP-14 tag naming for Debian releases
debian-tag = debian/%(version)s
debian-tag-msg = %(pkg)s Debian release %(version)s

# Sign tags by default
sign-tags = True

# Default builder
builder = debuild -i -I

# Compression
compression = xz
compression-level = 9
